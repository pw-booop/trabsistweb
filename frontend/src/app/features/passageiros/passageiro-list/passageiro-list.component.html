<div class="topo">
  <h1>Passageiros</h1>
  <a mat-flat-button routerLink="/passageiros/novo">
    <mat-icon>add</mat-icon> Novo passageiro
  </a>
</div>

<mat-form-field appearance="outline" class="busca">
  <mat-label>Buscar por nome ou CPF</mat-label>
  <input matInput [formControl]="busca" placeholder="Ex.: Ana ou 111.444">
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<p class="contagem">{{ linhas().length }} passageiro(s)</p>

<div class="tabela">
  <table mat-table [dataSource]="linhas()">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let p">{{ p.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="cpf">
      <th mat-header-cell *matHeaderCellDef>CPF</th>
      <td mat-cell *matCellDef="let p">{{ p.cpf }}</td>
    </ng-container>

    <ng-container matColumnDef="telefone">
      <th mat-header-cell *matHeaderCellDef>Telefone</th>
      <td mat-cell *matCellDef="let p">{{ p.telefone }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>E-mail</th>
      <td mat-cell *matCellDef="let p">{{ p.email ?? '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let p">
        <a mat-icon-button [routerLink]="['/passageiros', p.id, 'editar']"
           aria-label="Editar passageiro">
          <mat-icon>edit</mat-icon>
        </a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="vazio" [attr.colspan]="colunas.length">Nenhum passageiro encontrado.</td>
    </tr>
  </table>
</div>
